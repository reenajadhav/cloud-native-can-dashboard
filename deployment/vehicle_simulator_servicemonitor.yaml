---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: vehicle-simulator-monitor
  namespace: monitoring
  labels:
    release: prometheus

spec:
  selector:
    matchLabels:
      app: vehicle-data-simulator

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: metrics
      interval: 15s
