---
# =====================================================
# CAN-to-Cloud Analytics Platform
# Continuous Integration Pipeline
#
# Purpose:
#   1. Validate source code
#   2. Run unit tests
#   3. Verify Docker images build successfully
#   4. Validate Kubernetes YAML files
#
# Does NOT:
#   - Deploy anything
#   - Load images into Minikube
#   - Restart Kubernetes pods
#
# Deployment is handled separately by:
#   - platform.yml
#   - application.yml
# =====================================================

name: CAN Platform CI

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  validate:

    runs-on: self-hosted

    steps:

      # =====================================================
      # Checkout Repository
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Setup Python
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # Install Test Dependencies
      # =====================================================
      - name: Install Dependencies
        run: |
          pip install pytest
          pip install yamllint

      # =====================================================
      # Run Unit Tests
      # =====================================================
      - name: Run Tests
        run: |
          pytest

      # =====================================================
      # Validate YAML Files
      # =====================================================
      - name: Validate Deployment YAML
        run: |
          yamllint deployment/

      # =====================================================
      # Verify Repository Structure
      # =====================================================
      - name: Verify Project Structure
        run: |
          ls
          ls dashboard
          ls parser
          ls simulator

      # =====================================================
      # Build Dashboard Image
      # =====================================================
      - name: Build Dashboard Image
        run: |
          docker build -t can-dashboard:ci ./dashboard

      # =====================================================
      # Build Parser Image
      # =====================================================
      - name: Build Parser Image
        run: |
          docker build -t can-parser:ci ./parser

      # =====================================================
      # Build Simulator

