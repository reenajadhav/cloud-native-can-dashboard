---
# =====================================================
# CAN-to-Cloud Analytics Platform
# CI/CD Pipeline
#
# Purpose:
#   1. Run unit tests
#   2. Build Docker images
#   3. Load images into Minikube
#   4. Restart Kubernetes deployments
#   5. Verify rollout success
#
# Runner:
#   Self-hosted WSL + Minikube
# =====================================================

name: CAN Platform CI-CD

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-test-deploy:

    runs-on: self-hosted

    steps:

      # =====================================================
      # Checkout source code
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Setup Python
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # Install dependencies
      # =====================================================
      - name: Install Dependencies
        run: |
          pip install pytest

      # =====================================================
      # Run Unit Tests
      # =====================================================
      - name: Run Tests
        run: |
          pytest

      # =====================================================
      # Verify Minikube
      # =====================================================
      - name: Check Minikube Status
        run: |
          minikube status

      # =====================================================
      # Verify Kubernetes Cluster
      # =====================================================
      - name: Verify Kubernetes Cluster
        run: |
          kubectl get nodes

      # =====================================================
      # Build Dashboard Image
      # =====================================================
      - name: Build Dashboard Image
        run: |
          docker build -t can-dashboard:v1 ./dashboard

      # =====================================================
      # Build Parser Image
      # =====================================================
      - name: Build Parser Image
        run: |
          docker build -t can-parser:v1 ./parser

      # =====================================================
      # Build Simulator Image
      # =====================================================
      - name: Build Simulator Image
        run: |
          docker build -t vehicle_data_simulator:v1 ./simulator

      # =====================================================
      # Load Images into Minikube
      # =====================================================
      - name: Load Dashboard Image
        run: |
          minikube image load can-dashboard:v1

      - name: Load Parser Image
        run: |
          minikube image load can-parser:v1

      - name: Load Simulator Image
        run: |
          minikube image load vehicle_data_simulator:v1

      # =====================================================
      # Restart Deployments
      # =====================================================
      - name: Restart Dashboard Deployment
        run: |
          kubectl rollout restart deployment can-dashboard

      - name: Restart Parser Deployment
        run: |
          kubectl rollout restart deployment can-parser

      - name: Restart Simulator Deployment
        run: |
          kubectl rollout restart deployment vehicle-data-simulator

      # =====================================================
      # Wait for Deployments
      # =====================================================
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/can-dashboard
          kubectl rollout status deployment/can-parser
          kubectl rollout status deployment/vehicle-data-simulator

      # =====================================================
      # Verify Pods
      # =====================================================
      - name: Verify Pods
        run: |
          kubectl get pods

      # =====================================================
      # Verify Services
      # =====================================================
      - name: Verify Services
        run: |
          kubectl get svc