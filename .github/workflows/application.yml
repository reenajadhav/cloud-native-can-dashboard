---
name: Application CI-CD

on:

  push:
    branches:
      - main
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:

  application:

    runs-on: self-hosted

    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install pytest

      - name: Run Tests
        run: |
          pytest

      - name: Build Dashboard Image
        run: |
          docker build -t can-dashboard:${{ env.BUILD_NUMBER }} ./dashboard

      - name: Build Parser Image
        run: |
          docker build -t can-parser:${{ env.BUILD_NUMBER }} ./parser

      - name: Build Simulator Image
        run: |
          docker build -t vehicle_data_simulator:${{ env.BUILD_NUMBER }} ./simulator

      - name: Load Images
        run: |
          minikube image load can-dashboard:${{ env.BUILD_NUMBER }}
          minikube image load can-parser:${{ env.BUILD_NUMBER }}
          minikube image load vehicle_data_simulator:${{ env.BUILD_NUMBER }}

      - name: Update GitOps Manifests
        run: |

          cd ../can-platform-gitops

          # Dashboard
          sed -i \
          "s|image: can-dashboard:.*|image: can-dashboard:${BUILD_NUMBER}|g" \
          dashboard/dashboard_deployment.yaml

          # Parser
          sed -i \
          "s|image: can-parser:.*|image: can-parser:${BUILD_NUMBER}|g" \
          parser/parser_deployment.yaml

          # Simulator
          sed -i \
          "s|image: vehicle_data_simulator:.*|image: vehicle_data_simulator:${BUILD_NUMBER}|g" \
          simulator/vehicle_simulator_deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@local"

          git add .

          git commit -m "Update application images to build ${BUILD_NUMBER}" || true

          git push origin main

      - name: Verify Images
        run: |
          minikube image ls | grep can-dashboard
          minikube image ls | grep can-parser
          minikube image ls | grep vehicle_data_simulator
