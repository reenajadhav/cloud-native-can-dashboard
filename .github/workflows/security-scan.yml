--- 
name: security-scan
on:

  push:
    branches:
      - main
jobs:

  platform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          grep -R -E "(password=|passwd=|secret=|apikey=|token=)" . \
            --exclude-dir=.git \
            --exclude="*.md" \
            && exit 1 || true
