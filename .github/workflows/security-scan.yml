--- 
name: security-scan
on:

  push:
    branches:
      - main
jobs:

  platform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          if grep -R -i \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude="*.md" \
            "password=" .; then
            echo "Hardcoded password found"
            exit 1
          fi
